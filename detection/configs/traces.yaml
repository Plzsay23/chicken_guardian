# 소형 흔적 탐지 공통 설정. 스크립트는 전부 이 파일을 기본값으로 읽는다.

# 클래스. 순서가 곧 YOLO class id 다. 바꾸면 기존 라벨·가중치와 호환이 깨진다.
#   rodent_dropping : 쥐 배설물 (생쥐 3-6 mm, 시궁쥐 12-20 mm)
#   feed_pellet     : 흘린 사료 알갱이. 배설물과 가장 헷갈리는 대상이라 별도 클래스로 둔다 (FR-08)
classes:
  - rodent_dropping
  - feed_pellet

# 타일링. 학습·평가·추론이 같은 값을 써야 한다.
tile:
  size: 640          # 타일 한 변(px). 모델 imgsz 와 같게 둔다 -> 타일을 축소하지 않는다
  overlap: 0.2       # 타일 간 겹침 비율. 경계에 걸린 객체가 한쪽 타일에는 온전히 들어가게
  min_visibility: 0.6  # 타일에 잘린 박스는 원래 면적의 이 비율 이상 남아야 라벨로 남긴다
  neg_ratio: 0.35    # 양성 타일 수 대비 빈 타일(배경) 비율. 오탐 억제용

# 추론 모드 (FR-04: 주행 중 1차 탐지 -> 정지 후 2차 확인)
infer:
  patrol:            # 주행 중. 재현율 우선, 가볍게
    scale: 1.0       # 입력 프레임 배율. 0.75 로 내리면 타일 수가 약 절반
    overlap: 0.1
    conf: 0.15
    tta: false
  confirm:           # 정지 후 근접 촬영 확인. 정밀도 우선
    scale: 1.0
    overlap: 0.25
    conf: 0.35
    tta: true        # 상하·좌우 뒤집기 결과를 합친다
  iou_merge: 0.5     # 타일 간 중복 병합 기준 (IoS: 작은 박스 기준 겹침)

# 합성 데이터 (실사진이 모이기 전 부트스트랩용)
synth:
  frame: [1920, 1080]        # 카메라 해상도와 맞춘다
  gsd_mm_per_px: [0.25, 0.6] # 지면 해상도. 카메라 높이 30-50 cm, 화각 62도 기준 대략값
  ir_prob: 0.3               # 야간 NoIR + 940nm 조명 모사 비율 (FR-12)
  empty_prob: 0.15           # 객체 없는 프레임 비율
